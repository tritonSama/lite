name: hblite
description: HeavenlyBond Lite — community task & service marketplace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Models (code-gen) ────────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Maps & Location ──────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geoflutterfire_plus: ^0.0.31

  # ── Media ────────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1

  # ── UI ───────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.7.0
  gap: ^3.0.1

  # ── Utils ────────────────────────────────────────────
  uuid: ^4.5.1
  equatable: ^2.0.5
  collection: ^1.18.0
  path: ^1.9.0
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # ── Code generation ───────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0

  # ── Lints ─────────────────────────────────────────────
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
