name: hblite
description: HeavenlyBond Lite — community task & service marketplace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.2

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Models (code-gen) ────────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Maps & Location ──────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.3
  geoflutterfire_plus: ^0.0.31

  # ── Media ────────────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  cached_network_image: ^3.4.1

  # ── UI ───────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.20.3
  timeago: ^3.7.0
  gap: ^3.0.1

  # ── Utils ────────────────────────────────────────────
  uuid: ^4.5.1
  equatable: ^3.0.0
  collection: ^1.18.0
  path: ^1.9.0
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  fluorescent_core:
    path: third_party/fluorescent/fluorescent/packages/fluorescent_core
  fluorescent_ecs:
    path: third_party/fluorescent/fluorescent/packages/fluorescent_ecs
  fluorescent_fluorite:
    path: third_party/fluorescent/fluorescent/packages/fluorescent_fluorite
  fluorescent_vulkan:
    path: third_party/fluorescent/fluorescent/packages/fluorescent_vulkan
  fluorescent_flame:
    path: third_party/fluorescent/fluorescent/packages/fluorescent_flame
  flame: ^1.38.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # ── Code generation ───────────────────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.3

  # ── Lints ─────────────────────────────────────────────
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
